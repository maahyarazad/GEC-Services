<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blue test card</title>
  <style>
    :root { --gold: #dfab3c; --red: #1a3c8f; --box: 55px }
    body { margin: 0; display: flex; flex-direction: column; align-items: center; padding: 24px }
    .cardContainer { width: min(90vw, 520px); aspect-ratio: 1.45 }
    .card { position: relative; width: 100%; height: 100%; border-radius: 10px; background: var(--red); overflow: hidden }
    .cardLabel { position: absolute; right: 30px; top: 20%; color: var(--gold); font-size: 22px }
    .icons { position: absolute; left: 30px; right: 30px; top: 50%; display: flex; justify-content: space-between }
    .box { width: var(--box); height: var(--box); border-radius: 6px; display: flex; align-items: center; justify-content: center }
    .icon { border: 1.5px solid var(--gold) }
    .gec { background: var(--gold); color: #fff; font-weight: 700 }
  </style>
</head>
<body>
  <div class="cardContainer">
    <div class="card">
      <div class="cardLabel">Blue Test Card</div>
      <div class="icons">
        <div class="box icon"></div>
        <div class="box icon"></div>
        <div class="box gec">GEC</div>
      </div>
    </div>
  </div>
</body>
</html>
